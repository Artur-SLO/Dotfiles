# Font
font_family      family="JetBrainsMonoNL Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 10

# Kitty specifics
disable_ligatures always
enable_audio_bell no
remember_window_size no
cursor_blink_interval 0

# Shell
shell fish

# Scroll
map page_up scroll_page_up
map page_down scroll_page_down

# Background and window
window_padding_width 8
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0
background_opacity 0.85
dynamic_background_opacity yes

# Cursor
cursor_trail 1
cursor_shape block

# Mouse
url_style curly
open_url_with default
copy_on_select yes

# Remote control
allow_remote_control yes

# Binds
map super+ctrl+t launch --type=os-window --cwd=current

# Tabs
tab_bar_min_tabs 3
map ctrl+shift+t new_tab_with_cwd


# Split
enabled_layouts tall,fat,grid
include themes/noctalia.conf
